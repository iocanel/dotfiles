# mpd-hykr media submap for Hyprland.
#
# Source this from hyprland.conf:
#   source = ~/.config/hypr/media-submap.conf
#
# SUPER+m enters media mode, then a single key does the thing.
#   m -> pick something to play      o -> toggle the panel media menu
#   p -> play / pause                j -> next        k -> previous

bind = SUPER, M, submap, media
submap = media

# Actions that finish an interaction drop you back out.
bind = , M, exec, mpd-hykr
bind = , M, submap, reset
bind = , O, exec, hyprpanel --toggle-window=mediamenu
bind = , O, submap, reset
bind = , P, exec, mpc toggle
bind = , P, submap, reset

# Skip keys stay in the submap, so four tracks forward is SUPER+m j j j j
# rather than four separate chords.
bind = , J, exec, mpc next
bind = , K, exec, mpc prev

bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
